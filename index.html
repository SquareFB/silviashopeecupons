<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Cupons de Desconto</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 30px 20px;
      background-color: #f9f9f9;
    }
    h2 {
      color: #ee4d2d;
      margin-bottom: 20px;
      font-size: 24px;
      text-align: center;
    }
    .input-field {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 5px;
      box-sizing: border-box;
    }
    button.generate {
      padding: 12px;
      font-size: 16px;
      background-color: #ee4d2d;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    button.generate:hover {
      background-color: #dd3c1a;
    }
    button.generate:disabled {
      background-color: #f8aa9a;
      cursor: not-allowed;
    }
    .result {
      margin-top: 25px;
    }
    .result-label {
      font-weight: bold;
      margin-bottom: 5px;
    }
    textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      resize: none;
    }
    button.copy {
      background-color: #777;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
      margin-top: 10px;
    }
    button.copy:hover {
      background-color: #666;
    }
    .small {
      font-size: 14px;
      color: #666;
      margin-top: 10px;
      text-align: center;
    }
    .note {
      background-color: #fff3cd;
      color: #856404;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .loader {
      display: inline-block;
      width: 20px;
      height: 20px;
      margin-right: 8px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <h2>Gerador de cupons de desconto da Silvia</h2>
  <div class="note" id="note">
    <strong>Atenção:</strong> Insira um link curto(ex, <code>s.shopee.com.br/xyz</code>) ou normal para um produto da Shopee abaixo.
  </div>
  <div class="input-field">
    <label for="inputLink">Link do produto da Shopee:</label>
    <input type="text" id="inputLink" placeholder="Colar o link para o produto da Shopee aqui">
  </div>
  <button class="generate" id="generateButton" onclick="generateLink()">Gerar Link Com Cupom de Desconto!</button>
  <div class="result">
    <div class="result-label">Link com desconto do cupom aplicado:</div>
    <textarea id="resultLink" readonly></textarea>
    <button class="copy" onclick="copyToClipboard()">Abrir seu link com desconto em uma nova aba</button>
    <p class="small" id="copyStatus"></p>
  </div>
  <script>
    async function expandLink(url) {
      const response = await fetch(`/api/expand?url=${encodeURIComponent(url)}`); //chama expand js script em \api
      const data = await response.json();
      if (data.expandedUrl) return data.expandedUrl;
      throw new Error(data.error || 'Failed to expand link.');
    }
    function generateSubId() {
      return 'vercel-user-click';
    }
    function encodeURL(url) {
      return encodeURIComponent(url);
    }
    function getCleanBaseURL(url) {
      return url.split('?')[0];
    }
	function getCleanShopeeProductURL(url) {
	  urlSplit = url.split('/')
	  if ( urlSplit.length < 5 ) {
	    return getCleanBaseURL(url);
	  }
	  newProductURL = urlSplit[4] + '/' + urlSplit[5];
	  return 'https://shopee.com.br/product/' + newProductURL.split('?')[0];
	}
    async function generateLink() {
      const input = document.getElementById('inputLink').value.trim();
      const affiliateId = "18319210207";
      const resultArea = document.getElementById('resultLink');
      const copyStatus = document.getElementById('copyStatus');
      const generateButton = document.getElementById('generateButton');
      if (!input || !affiliateId) {
        alert('Insira um link para um produto da Shopee primeiro!');
        return;
      }
      // Show loading indicator
      generateButton.disabled = true;
      const originalButtonText = generateButton.innerHTML;
      generateButton.innerHTML = '<span class="loader"></span> Processing...';
      try {
        let finalUrl = input;
        if (input.includes('s.shopee.')) {
          finalUrl = await expandLink(input);
        }
        // Get clean base URL without any parameters
        //finalUrl = getCleanBaseURL(finalUrl);
		finalUrl = getCleanShopeeProductURL(finalUrl);
        const encoded = encodeURL(finalUrl);
        //const subId = generateSubId();
        const finalLink = `https://s.shopee.com.br/an_redir?origin_link=${encoded}&affiliate_id=${affiliateId}`;
        resultArea.value = finalLink;
        copyStatus.textContent = '';
      } catch (err) {
        console.error(err);
        alert('Error generating link: ' + err.message);
      } finally {
        // Restore button state
        generateButton.innerHTML = originalButtonText;
        generateButton.disabled = false;
      }
    }
  async function copyToClipboard() {
    const resultLink = document.getElementById('resultLink').value;
    const statusText = document.getElementById('copyStatus');
    if (!resultLink) {
      alert('Você deve gerar o cupom de desconto primeiro!');
      return;
    }
    try {
      await navigator.clipboard.writeText(resultLink);
      window.open(resultLink, '_blank'); // Open in new tab
      statusText.textContent = '✅ Desconto aplicado no produto!';
    } catch (err) {
      console.error('Copy failed:', err);
      statusText.textContent = '❌ Falha ao tentar gerar um cupom. Por favor insira um link válido!';
    }
  }
  </script>
</body>
</html>
